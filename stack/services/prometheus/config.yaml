global:
  scrape_interval: 15s
otlp:
  promote_resource_attributes:
    - service.name
    - deployment.environment.name
storage:
  tsdb:
    out_of_order_time_window: 5m
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
  - job_name: collector
    static_configs:
      - targets: ["${COLLECTOR_METRICS_HOST}:8888"]
