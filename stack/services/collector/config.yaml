extensions:
  health_check:
    endpoint: "[::]:13133"
    path: /ready
  basicauth/server:
    htpasswd:
      inline: ${env:OTLP_HTPASSWD}
  file_storage:
    directory: /var/lib/otelcol/queues
    create_directory: true
receivers:
  otlp:
    protocols:
      http:
        endpoint: "[::]:4318"
        auth:
          authenticator: basicauth/server
      grpc:
        endpoint: "[::]:4317"
        auth:
          authenticator: basicauth/server
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 384
    spike_limit_mib: 64
  batch:
    timeout: 1s
    send_batch_size: 512
    send_batch_max_size: 1024
exporters:
  otlphttp/logs:
    endpoint: ${env:LOKI_OTLP_BASE_URL}
    sending_queue:
      storage: file_storage
      queue_size: 1000
    retry_on_failure:
      initial_interval: 1s
      max_interval: 10s
      max_elapsed_time: 10m
  otlphttp/metrics:
    endpoint: ${env:PROMETHEUS_OTLP_BASE_URL}
    sending_queue:
      storage: file_storage
      queue_size: 1000
    retry_on_failure:
      initial_interval: 1s
      max_interval: 10s
      max_elapsed_time: 10m
  otlphttp/traces:
    endpoint: ${env:TEMPO_OTLP_BASE_URL}
    sending_queue:
      storage: file_storage
      queue_size: 1000
    retry_on_failure:
      initial_interval: 1s
      max_interval: 10s
      max_elapsed_time: 10m
service:
  extensions: [health_check, basicauth/server, file_storage]
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/logs]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/metrics]
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/traces]
