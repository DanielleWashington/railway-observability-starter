server:
  http_listen_port: 3200
distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: "[::]:4318"
        grpc:
          endpoint: "[::]:4317"
ingester:
  max_block_duration: 10s
  trace_idle_period: 1s
  complete_block_timeout: 10s
  lifecycler:
    address: 127.0.0.1
    ring:
      kvstore:
        store: inmemory
      replication_factor: 1
storage:
  trace:
    blocklist_poll: 5s
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks
compactor:
  compaction:
    block_retention: 60s
    compacted_block_retention: 10s
    compaction_cycle: 5s
