services:
  prometheus:
    image: prom/prometheus:v3.8.0
    user: "0"
    command: ["--config.file=/etc/prometheus/retention.yaml", "--storage.tsdb.path=/prometheus", "--storage.tsdb.retention.time=${RETENTION_PROM:-30d}", "--storage.tsdb.retention.size=2GB"]
    volumes:
      - ./prometheus.yaml:/etc/prometheus/retention.yaml:ro
      - prometheus-data:/prometheus
    ports: ["127.0.0.1:19090:9090"]
  tempo:
    image: grafana/tempo:2.9.0
    user: "0"
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports: ["127.0.0.1:13200:3200", "127.0.0.1:14318:4318"]
  loki:
    image: grafana/loki:3.6.2
    user: "0"
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./loki.yaml:/etc/loki/config.yaml:ro
      - loki-data:/var/loki
    ports: ["127.0.0.1:13100:3100"]
volumes:
  prometheus-data:
  tempo-data:
  loki-data:
