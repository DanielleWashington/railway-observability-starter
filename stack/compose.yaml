services:
  collector:
    build: services/collector
    user: "0"
    environment:
      OTLP_HTPASSWD: ${OTLP_HTPASSWD:?Run python3 scripts/bootstrap.py}
      PROMETHEUS_OTLP_BASE_URL: http://prometheus:9090/api/v1/otlp
      TEMPO_OTLP_BASE_URL: http://tempo:4318
      LOKI_OTLP_BASE_URL: http://loki:3100/otlp
    volumes: [collector-data:/var/lib/otelcol]
    mem_limit: 512m
    restart: unless-stopped
  prometheus:
    build: services/prometheus
    user: "0"
    environment:
      COLLECTOR_METRICS_HOST: collector
    volumes: [prometheus-data:/prometheus]
    restart: unless-stopped
  tempo:
    build: services/tempo
    user: "0"
    volumes: [tempo-data:/var/tempo]
    restart: unless-stopped
  loki:
    build: services/loki
    user: "0"
    volumes: [loki-data:/var/loki]
    restart: unless-stopped
  alert-sink:
    build:
      context: .
      dockerfile: tests/Dockerfile.alert-sink
    environment:
      ALERT_WEBHOOK_TOKEN: ${DEMO_TEST_TOKEN:?Run bootstrap}
    restart: unless-stopped
  grafana:
    build: services/grafana
    user: "0"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:?Run bootstrap}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      PROMETHEUS_QUERY_URL: http://prometheus:9090
      TEMPO_QUERY_URL: http://tempo:3200
      LOKI_QUERY_URL: http://loki:3100
      ALERT_WEBHOOK_URL: http://alert-sink:8080/webhook
      ALERT_WEBHOOK_TOKEN: ${DEMO_TEST_TOKEN:?Run bootstrap}
    volumes: [grafana-data:/var/lib/grafana]
    ports: ["127.0.0.1:3000:3000"]
    restart: unless-stopped
  downstream:
    build: examples/demo
    environment: &demo-env
      OTEL_SERVICE_NAME: demo-downstream
      OTEL_EXPORTER_OTLP_ENDPOINT: http://collector:4318
      OTEL_EXPORTER_OTLP_HEADERS: Authorization=${OTLP_AUTH:?Run bootstrap}
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      DEMO_TEST_TOKEN: ${DEMO_TEST_TOKEN:?Run bootstrap}
    restart: unless-stopped
  api:
    build: examples/demo
    environment:
      <<: *demo-env
      OTEL_SERVICE_NAME: demo-api
      DOWNSTREAM_URL: http://downstream:8080
    ports: ["127.0.0.1:8080:8080"]
    restart: unless-stopped
  ui-tests:
    build:
      context: .
      dockerfile: tests/Dockerfile.ui
    profiles: [test]
    environment:
      GRAFANA_URL: http://grafana:3000
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:?Run bootstrap}
    volumes: [./artifacts:/artifacts]
  tests:
    build:
      context: .
      dockerfile: tests/Dockerfile
    profiles: [test]
    environment:
      API_URL: http://api:8080
      DOWNSTREAM_URL: http://downstream:8080
      GRAFANA_URL: http://grafana:3000
      COLLECTOR_URL: http://collector:4318
      ALERT_SINK_URL: http://alert-sink:8080
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:?Run bootstrap}
      DEMO_TEST_TOKEN: ${DEMO_TEST_TOKEN:?Run bootstrap}
      OTLP_AUTH: ${OTLP_AUTH:?Run bootstrap}
    volumes: [./artifacts:/artifacts]
volumes:
  collector-data:
  prometheus-data:
  tempo-data:
  grafana-data:
  loki-data:
